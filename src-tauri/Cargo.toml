[package]
name = "gestao-agricola-gerencial"
version = "0.0.0"
description = "PoC em Tauri com paridade do fluxo atual offline-first"
authors = ["Yann Xavier"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.0.3", features = ["devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
